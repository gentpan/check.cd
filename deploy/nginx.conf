# Direct-ingress example. App .env.local: TRUST_PROXY_HEADER=x-real-ip
# Keep port 3000 private; compose.yaml publishes it only on 127.0.0.1.
# If Nginx itself is behind a CDN, configure ngx_http_realip_module FIRST with
# set_real_ip_from for ONLY that CDN's current IPv4/IPv6 CIDRs, its documented
# real_ip_header, and real_ip_recursive on. Otherwise $remote_addr is a CDN IP.
# Do not replace $remote_addr with $http_x_real_ip or an incoming header chain.
# https://nginx.org/en/docs/http/ngx_http_realip_module.html
server {
    listen 80;
    server_name check.cd www.check.cd;
    client_max_body_size 128k;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # The app receives only the normalized address above, never a CDN header.
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 240s;
        proxy_connect_timeout 10s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

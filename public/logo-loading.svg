<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none">
  <style>
    .ray{fill:#ff630d;opacity:.24;animation:highlight 1s steps(1,end) infinite}
    @keyframes highlight{0%{opacity:1}12.5%,100%{opacity:.24}}
    @media(prefers-reduced-motion:reduce){.ray{animation:none;opacity:1}}
  </style>
  <g>
    <rect class="ray" x="164" y="32" width="32" height="104" rx="4" transform="rotate(0 180 180)" style="animation-delay:0s" />
    <rect class="ray" x="164" y="32" width="32" height="104" rx="4" transform="rotate(45 180 180)" style="animation-delay:-0.875s" />
    <rect class="ray" x="164" y="32" width="32" height="104" rx="4" transform="rotate(90 180 180)" style="animation-delay:-0.75s" />
    <rect class="ray" x="164" y="32" width="32" height="104" rx="4" transform="rotate(135 180 180)" style="animation-delay:-0.625s" />
    <rect class="ray" x="164" y="32" width="32" height="104" rx="4" transform="rotate(180 180 180)" style="animation-delay:-0.5s" />
    <rect class="ray" x="164" y="32" width="32" height="104" rx="4" transform="rotate(225 180 180)" style="animation-delay:-0.375s" />
    <rect class="ray" x="164" y="32" width="32" height="104" rx="4" transform="rotate(270 180 180)" style="animation-delay:-0.25s" />
    <rect class="ray" x="164" y="32" width="32" height="104" rx="4" transform="rotate(315 180 180)" style="animation-delay:-0.125s" />
  </g>
</svg>

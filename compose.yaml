services:
  checkcd:
    build: .
    restart: unless-stopped
    env_file: .env.local
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NEWS_DATA_PATH: /app/data/news.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - news-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  news-data:
